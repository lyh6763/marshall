<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Unbranded home speaker illustration; simplified form, not a product photograph. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#55585a"/>
      <stop offset="1" stop-color="#323435"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2b2d"/>
      <stop offset="1" stop-color="#161718"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9cdd0"/>
      <stop offset="1" stop-color="#8d9295"/>
    </linearGradient>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#222325"/>
      <circle cx="6" cy="6" r="2.4" fill="#303133"/>
    </pattern>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <ellipse cx="500" cy="756" rx="370" ry="30" fill="url(#shadow)"/>
  <!-- cabinet -->
  <rect x="170" y="318" width="660" height="420" rx="26" fill="url(#body)"/>
  <rect x="182" y="330" width="636" height="396" rx="18" fill="none" stroke="#3a3c3e" stroke-width="3"/>
  <!-- control strip with three knobs -->
  <rect x="204" y="350" width="592" height="62" rx="8" fill="url(#strip)"/>
  <g fill="#151617">
    <circle cx="616" cy="381" r="17"/><circle cx="672" cy="381" r="17"/><circle cx="728" cy="381" r="17"/>
  </g>
  <g stroke="#e9ecee" stroke-width="3" stroke-linecap="round">
    <path d="M616 381l-6-11M672 381l2-12M728 381l9-8"/>
  </g>
  <rect x="234" y="373" width="64" height="16" rx="8" fill="#151617"/>
  <circle cx="320" cy="381" r="6" fill="#e3e6e8"/>
  <!-- grille -->
  <rect x="204" y="430" width="592" height="276" rx="12" fill="url(#mesh)"/>
  <rect x="204" y="430" width="592" height="276" rx="12" fill="none" stroke="#0f1011" stroke-width="6"/>
  <!-- feet -->
  <rect x="236" y="736" width="56" height="16" rx="6" fill="#0f1011"/>
  <rect x="708" y="736" width="56" height="16" rx="6" fill="#0f1011"/>
</svg>
