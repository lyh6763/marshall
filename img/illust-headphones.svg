<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Unbranded over-ear headphone illustration; simplified form, not a product photograph. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#55585a"/>
      <stop offset="1" stop-color="#323435"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2d2f"/>
      <stop offset="1" stop-color="#151617"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d9295"/>
      <stop offset=".5" stop-color="#d3d6d8"/>
      <stop offset="1" stop-color="#8d9295"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity=".4"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <ellipse cx="500" cy="800" rx="330" ry="28" fill="url(#shadow)"/>
  <!-- headband -->
  <path d="M286 560C286 330 382 232 500 232S714 330 714 560" fill="none" stroke="#141516" stroke-width="54" stroke-linecap="round"/>
  <path d="M318 520C318 352 398 272 500 272S682 352 682 520" fill="none" stroke="#2b2c2e" stroke-width="22" stroke-linecap="round"/>
  <g fill="none" stroke="#3a3c3e" stroke-width="3" stroke-dasharray="2 12">
    <path d="M318 520C318 352 398 272 500 272S682 352 682 520"/>
  </g>
  <!-- sliders -->
  <rect x="270" y="520" width="32" height="70" rx="8" fill="url(#metal)"/>
  <rect x="698" y="520" width="32" height="70" rx="8" fill="url(#metal)"/>
  <!-- left cup -->
  <ellipse cx="286" cy="660" rx="98" ry="132" fill="url(#shell)"/>
  <ellipse cx="300" cy="660" rx="74" ry="106" fill="#232426"/>
  <ellipse cx="300" cy="660" rx="52" ry="80" fill="none" stroke="#3a3c3e" stroke-width="3"/>
  <!-- right cup -->
  <ellipse cx="714" cy="660" rx="98" ry="132" fill="url(#shell)"/>
  <ellipse cx="700" cy="660" rx="74" ry="106" fill="#232426"/>
  <ellipse cx="700" cy="660" rx="52" ry="80" fill="none" stroke="#3a3c3e" stroke-width="3"/>
  <circle cx="760" cy="712" r="11" fill="#d3d6d8"/>
</svg>
