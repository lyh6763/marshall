name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PR에서는 lint·test·사이트 모으기까지만 하고 배포하지 않는다.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포(main 푸시·수동 실행)가 겹치면 진행 중인 것을 끝까지 마친다.
# PR 검사는 PR마다 따로 묶는다. 같은 pages 그룹에 들어가면 대기 중인 배포를 밀어내 취소시킬 수 있다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ESLint(js/, scripts/) + Stylelint(css/), 경고도 실패
      - run: npm run lint

      # 마크업 구조·링크·자산 경로·쓰지 않는 자산 검사(scripts/validate.mjs)
      - run: npm test

      # 사이트 파일만 _site/로 모으고, 모든 로컬 참조가 그 안에 있는지 검사
      - run: node scripts/build-site.mjs

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      # v4부터 점(.)으로 시작하는 파일은 올리지 않는다. _site에는 그런 파일이 없다.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # main 푸시와 main에서의 수동 실행만 배포한다.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
